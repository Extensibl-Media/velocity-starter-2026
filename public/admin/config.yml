      # END GENERATED SECTIONS
  - name: services
    label: Services
    folder: src/content/services
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Slug
        name: slug
        widget: string
        hint: URL-friendly e.g. roof-repair
      - label: Short Description
        name: description
        widget: text
      - label: Content
        name: content
        widget: markdown
        required: false
        hint: Longer body copy (optional)
      - label: Meta Title
        name: metaTitle
        widget: string
        required: false
      - label: Meta Description
        name: metaDescription
        widget: text
        required: false
      - label: Featured Image
        name: image
        widget: image
        required: false
      - label: Category
        name: category
        widget: relation
        collection: serviceCategories
        value_field: slug
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: Group services on pages by category
      - label: Emergency Service
        name: isEmergency
        widget: boolean
        default: false
      - label: Featured
        name: featured
        widget: boolean
        default: false
      - label: Order
        name: order
        widget: number
        default: 0
  - name: serviceCategories
    label: Service Categories
    folder: src/content/service-categories
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - label: Title
        name: title
        widget: string
      - label: Slug
        name: slug
        widget: string
        hint: URL-friendly e.g. roofing
      - label: Description
        name: description
        widget: text
        required: false
      - label: Icon
        name: icon
        widget: string
        required: false
        hint: Optional icon key (e.g. shield, droplet, home)
      - label: Order
        name: order
        widget: number
        default: 0
  - name: service_areas
    label: Service Areas
    folder: src/content/service-areas
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    fields:
      - label: City
        name: city
        widget: string
      - label: State
        name: state
        widget: string
      - label: Slug
        name: slug
        widget: string
        hint: e.g. austin-tx
      - label: County
        name: county
        widget: string
        required: false
      - label: Featured
        name: featured
        widget: boolean
        default: false
      - label: Order
        name: order
        widget: number
        default: 0
  - name: faqs
    label: FAQs
    folder: src/content/faqs
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    fields:
      - label: Question
        name: question
        widget: string
      - label: Answer
        name: answer
        widget: text
      - label: Related Service
        name: service
        widget: relation
        collection: services
        search_fields:
