# Local editing without auth: run `npm run cms` (starts the decap proxy) and open
# http://localhost:4321/admin. Decap uses the local filesystem when it detects the
# proxy on localhost:8081; in production (no proxy) it falls back to git-gateway
# below. Safe to leave enabled.
local_backend: true
backend:
  name: git-gateway
  repo: Extensibl-Media/velocity-starter-2026
  branch: master
  auth_type: pkce
  base_url: "https://auth.decapbridge.com"
  auth_endpoint: /sites/cc7922fa-6c8f-4b68-87c0-7c2c5ea37c94/pkce
  auth_token_endpoint: /sites/cc7922fa-6c8f-4b68-87c0-7c2c5ea37c94/token
  gateway_url: "https://gateway.decapbridge.com"
  commit_messages:
    create: >-
      Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via
      DecapBridge
    update: >-
      Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via
      DecapBridge
    delete: >-
      Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via
      DecapBridge
    uploadMedia: 'Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: "Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge"
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url
logo_url: "https://decapbridge.com/decapcms-with-bridge.svg"
site_url: "https://vws-starter-2026.pages.dev"
media_folder: src/assets/images/uploads
public_folder: /images/uploads
collections:
  - name: settings
    label: Site Settings
    files:
      - name: general
        label: General Settings
        file: src/content/settings/general.json
        fields:
          - label: Business Name
            name: businessName
            widget: string
          - label: Tagline
            name: tagline
            widget: string
          - label: Phone Number
            name: phone
            widget: string
          - label: Email
            name: email
            widget: string
          - label: Address
            name: address
            widget: string
          - label: City
            name: city
            widget: string
          - label: State
            name: state
            widget: string
          - label: Zip
            name: zip
            widget: string
          - label: License Number
            name: license
            widget: string
            required: false
          - label: Google Business Profile URL
            name: gbpUrl
            widget: string
            required: false
          - label: Social Links
            name: social
            widget: object
            required: false
            fields:
              - label: Facebook
                name: facebook
                widget: string
                required: false
              - label: Instagram
                name: instagram
                widget: string
                required: false
              - label: Youtube
                name: youtube
                widget: string
                required: false
      - name: hours
        label: Business Hours
        file: src/content/settings/hours.json
        fields:
          - label: Hours
            name: hours
            widget: list
            fields:
              - label: Day
                name: day
                widget: string
              - label: Open
                name: open
                widget: string
              - label: Close
                name: close
                widget: string
              - label: Closed All Day
                name: closedAllDay
                widget: boolean
                default: false
      - name: seo
        label: SEO Defaults
        file: src/content/settings/seo.json
        fields:
          - label: Default Meta Title
            name: metaTitle
            widget: string
          - label: Default Meta Description
            name: metaDescription
            widget: text
          - label: Google Site Verification
            name: googleVerification
            widget: string
            required: false
          - label: Bing Site Verification
            name: bingVerification
            widget: string
            required: false
      - name: navigation
        label: Navigation
        file: src/content/settings/navigation.json
        fields:
          - label: Nav Items
            name: items
            widget: list
            fields:
              - label: Label
                name: label
                widget: string
              - label: URL
                name: href
                widget: string
                required: false
              - label: Enabled
                name: enabled
                widget: boolean
                default: true
              - label: Auto Populate
                name: autoPopulate
                widget: select
                required: false
                hint: Auto-populate children from a collection
                options:
                  - label: None
                    value: ""
                  - label: Services
                    value: services
                  - label: Service Areas
                    value: service-areas
              - label: Children
                name: children
                widget: list
                required: false
                hint: Manual child links — ignored if Auto Populate is set
                fields:
                  - label: Label
                    name: label
                    widget: string
                  - label: URL
                    name: href
                    widget: string
                    required: false
                  - label: Enabled
                    name: enabled
                    widget: boolean
                    default: true
                  - label: Children
                    name: children
                    widget: list
                    required: false
                    fields:
                      - label: Label
                        name: label
                        widget: string
                      - label: URL
                        name: href
                        widget: string
                      - label: Enabled
                        name: enabled
                        widget: boolean
                        default: true
  - name: pages
    label: Pages
    folder: src/content/pages
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: "{{fields.slug}}"
    fields:
      - label: URL Slug
        name: slug
